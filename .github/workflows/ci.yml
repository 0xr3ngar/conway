name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format check (oxfmt)
              run: bunx oxfmt --check src/

            - name: Lint (oxlint)
              run: bunx oxlint src/

            - name: Tests (bun)
              run: bun test
